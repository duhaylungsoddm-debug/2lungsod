<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Sapatosan ni Tekyo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-image: url('shoes.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Navbar Layout */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 50px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            flex-wrap: wrap;
        }

        /* Logo Sizing */
        .logo img {
            height: 100px;
            width: auto;
            border-radius: 50%;
        }

        /* Navigation Links Container */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            flex-wrap: wrap;
        }

        /* Individual Navigation Links */
        .nav-links li a {
            text-decoration: none;
            color: black;
            font-size: 30px;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .nav-links li a:hover,
        .nav-links li a.active {
            color: #007BFF;
        }

        .nav-links li a.Logout {
            color: #dc3545;
        }

        .nav-links li a.Logout:hover {
            color: #bd2130;
        }

        /* Hero Section */
        main {
            text-align: center;
            padding: 100px 20px;
            width: 90%;
            max-width: 900px;
            margin: 50px auto;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }

        main h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        main p {
            color: white;
            font-size: 26px;
            line-height: 1.5;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                padding: 15px 20px;
                gap: 15px;
            }

            .logo img {
                height: 70px;
            }

            .nav-links {
                gap: 15px;
                justify-content: center;
            }

            .nav-links li a {
                font-size: 18px;
            }

            main {
                margin: 30px auto;
                padding: 40px 20px;
            }

            main h1 {
                font-size: 2rem;
            }

            main p {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                gap: 10px;
            }

            .nav-links li a {
                font-size: 15px;
            }

            main {
                padding: 30px 15px;
            }

            main h1 {
                font-size: 1.6rem;
            }

            main p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="navbar">
            <!-- Logo -->
            <div class="logo">
                <a href="home.html"><img src="lg.jpg" alt="Sapatosan ni Tekyo"></a>
            </div>
            <!-- Navigation Links -->
            <ul class="nav-links">
                <li><a href="home.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="product.html">Product</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="index.html" class="Logout">Logout</a></li>
            </ul>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <h1>Welcome sa Sapatosan ni Tekyo!</h1>
        <p>Don't just wear shoes, wear confidence. Shop the latest collection and enjoy free delivery.</p>
    </main>
     <script>
        function validationForm(event) {
            event.preventDefault();
            const username = document.getElementById("pa").value;
            const password = document.getElementById("chups").value;

            if (username === "pa" && password === "chups") {
                window.location.href = "home.html";
                return false;
            } else {
                alert("Invalid username or password");
                return false;
            }
        }
    </script>

</body>
</html>
